# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: wss_db
      DB_PORT: 5432
      DB_USER: wss
      DB_PASSWORD: WSS
      DB_NAME: wss_dev
      JWT_SECRET: dev-secret
      JWT_EXPIRES_IN: 1h
      BCRYPT_SALT_ROUNDS: 10
    ports:
      - 3000:3000
    networks:
      - app
    depends_on:
      - wss_db

  wss_db:
    image: postgres:16.3
    container_name: wss_db_a
    environment:
      POSTGRES_DB: wss_dev
      POSTGRES_USER: wss
      POSTGRES_PASSWORD: WSS
    ports:
      - "5432:5432"
    volumes:
      - wss_db_data_a:/var/lib/postgresql/data
    networks:
      - app
  
  wss_db_admin:
    image: dpage/pgadmin4:latest
    container_name: wss_db_admin_a
    environment:
      PGADMIN_DEFAULT_EMAIL: wss@wss.com
      PGADMIN_DEFAULT_PASSWORD: 'WSS'
    ports:
      - "8080:80"
    volumes:
      - wss_db_admin_data_a:/var/lib/pgadmin
    networks:
      - app

volumes:
  wss_db_data_a:
  wss_db_admin_data_a:

networks:
  app:
    driver: bridge

